service: ms-core-hr

frameworkVersion: '3'

provider:
  vpc:
    securityGroupIds:
      - sg-064b16dfac59045e9
    subnetIds:
      - subnet-0407a9201fdf8c177
      - subnet-01803dd48291ce9a5
  name: aws
  runtime: python3.11
  region: us-east-1
  memorySize: 512
  timeout: 30
  iam:
    role: arn:aws:iam::537206273759:role/LabRole
  environment:
    DB_HOST: ${env:DB_HOST, '[FALTA_INTEGRANTE_1_DB_HOST]'}
    DB_PORT: ${env:DB_PORT, '5432'}
    DB_NAME: ${env:DB_NAME, '[FALTA_INTEGRANTE_1_DB_NAME]'}
    DB_USER: ${env:DB_USER, '[FALTA_INTEGRANTE_1_DB_USER]'}
    DB_PASSWORD: ${env:DB_PASSWORD, '[FALTA_INTEGRANTE_1_DB_PASSWORD]'}
    SNS_HR_EVENTS_ARN: arn:aws:sns:us-east-1:537206273759:hcm-hr-dev-events
    S3_BUCKET_NAME: hcm-app-storage-537206273759-dev

package:
  artifact: ../../.artifacts/core-hr.zip

functions:
  core_hr_api:
    handler: router.lambda_handler
    events:
      - sqs:
          arn: arn:aws:sqs:us-east-1:537206273759:hcm-events-dev-hr-recruitment-sync
          batchSize: 1
          maximumConcurrency: 2
          functionResponseType: ReportBatchItemFailures
      - http:
          path: /employees/{id}/complete-onboarding
          method: post
          cors: true
          authorizer:
            name: customAuthorizer
            type: token
            arn: arn:aws:lambda:us-east-1:537206273759:function:hcm-auth-dev-authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
      - http:
          path: /departments
          method: get
          cors: true
          authorizer:
            name: customAuthorizer
            type: token
            arn: arn:aws:lambda:us-east-1:537206273759:function:hcm-auth-dev-authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
      - http:
          path: /departments
          method: post
          cors: true
          authorizer:
            name: customAuthorizer
            type: token
            arn: arn:aws:lambda:us-east-1:537206273759:function:hcm-auth-dev-authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
      - http:
          path: /employees
          method: get
          cors: true
          authorizer:
            name: customAuthorizer
            type: token
            arn: arn:aws:lambda:us-east-1:537206273759:function:hcm-auth-dev-authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
      - http:
          path: /employees/{id}
          method: get
          cors: true
          authorizer:
            name: customAuthorizer
            type: token
            arn: arn:aws:lambda:us-east-1:537206273759:function:hcm-auth-dev-authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
      - http:
          path: /employees
          method: post
          cors: true
          authorizer:
            name: customAuthorizer
            type: token
            arn: arn:aws:lambda:us-east-1:537206273759:function:hcm-auth-dev-authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
      - http:
          path: /employees/{id}
          method: put
          cors: true
          authorizer:
            name: customAuthorizer
            type: token
            arn: arn:aws:lambda:us-east-1:537206273759:function:hcm-auth-dev-authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
      - http:
          path: /employees/{id}/contract-upload-url
          method: post
          cors: true
          authorizer:
            name: customAuthorizer
            type: token
            arn: arn:aws:lambda:us-east-1:537206273759:function:hcm-auth-dev-authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
      - http:
          path: /employees/{id}/contract-url
          method: get
          cors: true
          authorizer:
            name: customAuthorizer
            type: token
            arn: arn:aws:lambda:us-east-1:537206273759:function:hcm-auth-dev-authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
