service: ms-payroll

frameworkVersion: '3'

provider:
  vpc:
    securityGroupIds:
      - sg-064b16dfac59045e9
    subnetIds:
      - subnet-0407a9201fdf8c177
      - subnet-01803dd48291ce9a5
  name: aws
  runtime: python3.11
  region: us-east-1
  memorySize: 512
  timeout: 30
  iam:
    role: arn:aws:iam::537206273759:role/LabRole
  environment:
    DB_HOST: ${env:DB_HOST, '[FALTA_INTEGRANTE_1_DB_HOST]'}
    DB_PORT: ${env:DB_PORT, '5432'}
    DB_NAME: ${env:DB_NAME, '[FALTA_INTEGRANTE_1_DB_NAME]'}
    DB_USER: ${env:DB_USER, '[FALTA_INTEGRANTE_1_DB_USER]'}
    DB_PASSWORD: ${env:DB_PASSWORD, '[FALTA_INTEGRANTE_1_DB_PASSWORD]'}
    S3_BUCKET_NAME: hcm-app-storage-537206273759-dev
    SNS_PAYROLL_EVENTS_ARN: arn:aws:sns:us-east-1:537206273759:hcm-payroll-dev-events

package:
  artifact: ../../.artifacts/payroll.zip

functions:
  # ==========================================================================
  # ENDPOINTS REST UNIFICADOS (API Gateway + Lambda Custom Authorizer)
  # ==========================================================================
  payroll_api:
    handler: router.lambda_handler
    events:
      - http:
          path: /payrolls/calculate
          method: post
          cors: true
          authorizer:
            name: customAuthorizer
            type: token
            arn: arn:aws:lambda:us-east-1:537206273759:function:hcm-auth-dev-authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
      - http:
          path: /payrolls/{period}
          method: get
          cors: true
          authorizer:
            name: customAuthorizer
            type: token
            arn: arn:aws:lambda:us-east-1:537206273759:function:hcm-auth-dev-authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
      - http:
          path: /payrolls/employee/{employee_id}
          method: get
          cors: true
          authorizer:
            name: customAuthorizer
            type: token
            arn: arn:aws:lambda:us-east-1:537206273759:function:hcm-auth-dev-authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization

  # ==========================================================================
  # WORKERS ASÍNCRONOS SQS (Event-Driven Architecture - Semana 15)
  # ==========================================================================
  syncEmployeeCreatedWorker:
    handler: handlers/sync_employee_created_worker.lambda_handler
    timeout: 30
    events:
      - sqs:
          # Export equivalente en hcm-events: !ImportValue hcm-events-${sls:stage}-payroll-hr-sync-queue-arn
          arn: arn:aws:sqs:us-east-1:537206273759:hcm-events-dev-payroll-hr-sync
          batchSize: 10
          enabled: true
          maximumConcurrency: 2
          functionResponseType: ReportBatchItemFailures

  syncLeaveApprovedWorker:
    handler: handlers/sync_leave_approved_worker.lambda_handler
    timeout: 30
    events:
      - sqs:
          # Export equivalente en hcm-events: !ImportValue hcm-events-${sls:stage}-payroll-attendance-sync-queue-arn
          arn: arn:aws:sqs:us-east-1:537206273759:hcm-events-dev-payroll-attendance-sync
          batchSize: 10
          enabled: true
          maximumConcurrency: 2
          functionResponseType: ReportBatchItemFailures
